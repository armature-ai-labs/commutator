[workspace]
resolver = "3"
members = ["crates/commutator-router", "crates/commutator-server"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/armature-ai-labs/commutator"
homepage = "https://github.com/armature-ai-labs/commutator"
authors = ["Armature AI Labs"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
